<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Simulacro de examen · Microinformática</title>
  <meta name="description" content="Simulacro de examen con preguntas al azar de los apuntes de fuente, chasis, tarjetas, ampliaciones y diagnóstico.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%276%27%20fill%3D%27%232E3440%27%2F%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%2388C0D0%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%3E%3Crect%20x%3D%277%27%20y%3D%277%27%20width%3D%2718%27%20height%3D%2718%27%20rx%3D%273%27%2F%3E%3Cpath%20d%3D%27M12%2012h8v8h-8zM12%202v3M20%202v3M12%2027v3M20%2027v3M2%2012h3M2%2020h3M27%2012h3M27%2020h3%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<script>
  (() => {
    try {
      const saved = localStorage.getItem("temario-tema");
      if (saved === "dark" || saved === "light") { document.documentElement.dataset.theme = saved; return; }
    } catch (_) {}
    document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  })();
</script>
<style>
:root{
  color-scheme:dark;
  --bg:#2E3440; --surface:#3B4252; --surface-hover:#434C5E; --text:#ECEFF4; --muted:#D8DEE9; --border:#596579;
  --accent:#88C0D0; --accent-text:#24313A; --focus:#88C0D0; --success:#A3BE8C; --danger:#E0868E; --warning:#EBCB8B;
  --content:760px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#ECEFF4; --surface:#E5E9F0; --surface-hover:#D8DEE9; --text:#2E3440; --muted:#434C5E; --border:#A0AAB9;
  --accent:#5E81AC; --accent-text:#FFFFFF; --focus:#5E81AC; --success:#426B35; --danger:#A3414A; --warning:#76530B;
}
*{box-sizing:border-box}
html{min-width:320px;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit;text-underline-offset:3px}
a:hover{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
button{font:inherit}

.wrap{width:min(var(--content),calc(100% - 32px));margin:0 auto;padding:var(--s4) 0 var(--s6)}
.barra{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-bottom:var(--s3);border-bottom:1px solid var(--border);margin-bottom:var(--s5)}
.barra a{font-size:14px;color:var(--muted);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.barra a:hover{color:var(--accent)}
.tema-btn{display:inline-grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);cursor:pointer}
.tema-btn:hover{border-color:var(--accent)}
.tema-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html[data-theme="light"] .sun{display:none}
html:not([data-theme="light"]) .moon{display:none}

h1{font-size:clamp(28px,5vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0 0 var(--s2)}
h2{font-size:22px;line-height:1.25;margin:0 0 var(--s3)}
.titulo-grande{font-size:clamp(28px,5vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0 0 var(--s2)}
.intro{color:var(--muted);max-width:60ch;margin:0 0 var(--s5)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:var(--s5);margin-bottom:var(--s4)}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 var(--s2)}

/* Inicio */
.opciones-n{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s4)}
.opciones-n label{position:relative}
.opciones-n input{position:absolute;opacity:0;width:1px;height:1px}
.opciones-n span{display:inline-flex;align-items:center;min-height:44px;padding:var(--s2) var(--s4);border:1px solid var(--border);border-radius:8px;background:var(--surface-hover);color:var(--text);font-weight:600;cursor:pointer}
.opciones-n input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.opciones-n input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:var(--s2) var(--s4);border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--accent-text);font-weight:700;cursor:pointer}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default}
.btn.secundario{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn.secundario:hover:not(:disabled){border-color:var(--accent)}
.resumen{color:var(--muted);font-size:14px;margin-top:var(--s3)}

/* Pregunta */
.progreso{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);font-size:14px;color:var(--muted);margin-bottom:var(--s3)}
.barra-progreso{height:6px;background:var(--surface-hover);border-radius:999px;overflow:hidden;margin-bottom:var(--s5)}
.barra-progreso b{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.fuente{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border:1px solid var(--border);border-radius:6px;color:var(--muted);margin-bottom:var(--s3)}
.pregunta{font-size:19px;font-weight:600;line-height:1.4;margin:0 0 var(--s4)}
.opcion{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:48px;padding:var(--s3) var(--s4);margin-bottom:var(--s2);text-align:left;background:var(--surface-hover);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer}
.opcion:hover:not(:disabled){border-color:var(--accent)}
.opcion .letra{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border:1px solid currentColor;border-radius:6px;font-size:13px;font-weight:700}
.opcion[aria-pressed="true"]{border:2px solid var(--accent);background:var(--surface)}
.opcion.correcta{border:2px solid var(--success);background:var(--surface)}
.opcion.correcta .letra{background:var(--success);border-color:var(--success);color:#24313A}
.opcion.fallo{border:2px solid var(--danger);background:var(--surface)}
.opcion.fallo .letra{background:var(--danger);border-color:var(--danger);color:#24313A}
.opcion:disabled{cursor:default}

.feedback{margin-top:var(--s4);padding:var(--s4);border:1px solid var(--border);background:var(--surface-hover);border-radius:8px}
.feedback.ok{border-color:var(--success)}
.feedback.mal{border-color:var(--danger)}
.feedback strong{display:block;margin-bottom:var(--s1)}
.feedback.ok strong{color:var(--success)}
.feedback.mal strong{color:var(--danger)}
.feedback p{margin:0;color:var(--text)}
.feedback .ver{display:inline-block;margin-top:var(--s2);font-size:14px;font-weight:600;color:var(--accent)}
.acciones{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s4)}

/* Resultado */
.marcador{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1}
.marcador small{font-size:18px;color:var(--muted);font-weight:600;margin-left:var(--s2)}
.revision{list-style:none;margin:var(--s5) 0 0;padding:0;display:grid;gap:var(--s3)}
.revision li{padding:var(--s4);background:var(--surface);border:1px solid var(--border);border-radius:8px}
.revision li.ok{border-color:var(--success)}
.revision li.mal{border-color:var(--danger)}
.revision .p{font-weight:600;margin:var(--s1) 0 var(--s2)}
.revision .r{font-size:14px;color:var(--muted);margin:0}
.revision .r b{color:var(--text)}
.revision a{font-size:14px;font-weight:600;color:var(--accent)}

@media (max-width:480px){
  .card{padding:var(--s4)}
  .acciones{flex-direction:column-reverse}
  .acciones .btn{width:100%}
  .pregunta{font-size:17px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="barra">
    <a href="index.html">← Temario</a>
    <button type="button" class="tema-btn" id="tema" aria-label="Cambiar tema"></button>
  </div>

  <!-- Inicio del simulacro -->
  <section id="inicio">
    <h1>Simulacro de examen</h1>
    <p class="intro">Preguntas al azar de todos los apuntes: fuente, chasis, tarjetas de expansión, ampliaciones y diagnóstico. Cada pregunta indica de qué apunte sale, para que puedas repasarla.</p>

    <div class="card">
      <p class="label">Número de preguntas</p>
      <div class="opciones-n" role="radiogroup" aria-label="Número de preguntas">
        <label><input type="radio" name="n" value="10" checked><span>10</span></label>
        <label><input type="radio" name="n" value="20"><span>20</span></label>
        <label><input type="radio" name="n" value="30"><span>30</span></label>
        <label><input type="radio" name="n" value="todas"><span>Todas</span></label>
      </div>
      <button type="button" class="btn" id="empezar">Empezar simulacro</button>
      <p class="resumen" id="total"></p>
    </div>
  </section>

  <!-- Preguntas -->
  <section id="prueba" hidden>
    <div class="progreso"><span id="contador"></span><span id="aciertos"></span></div>
    <div class="barra-progreso"><b id="barra"></b></div>
    <div class="card">
      <span class="fuente" id="fuente"></span>
      <h2 class="pregunta" id="pregunta"></h2>
      <div id="opciones" role="group" aria-label="Opciones de respuesta"></div>
      <div class="feedback" id="feedback" hidden></div>
      <div class="acciones">
        <button type="button" class="btn secundario" id="salir">Terminar ahora</button>
        <button type="button" class="btn" id="comprobar" disabled>Comprobar</button>
        <button type="button" class="btn" id="siguiente" hidden>Siguiente</button>
      </div>
    </div>
  </section>

  <!-- Resultado -->
  <section id="resultado" hidden>
    <h2 class="titulo-grande">Resultado</h2>
    <div class="card">
      <div class="marcador"><span id="nota"></span><small id="porcentaje"></small></div>
      <p class="intro" id="mensaje" style="margin:var(--s3) 0 0"></p>
      <ul class="revision" id="revision"></ul>
      <div class="acciones" style="justify-content:flex-start;margin-top:var(--s5)">
        <button type="button" class="btn" id="repetir">Nuevo simulacro</button>
      </div>
    </div>
  </section>
</div>

<script src="examen/banco.js"></script>
<script>
(() => {
  /* Nombre y fichero de cada apunte. Los PDF están en apuntes/. */
  const APUNTES = {
    S07: { nombre: 'Apuntes S07 · La fuente de alimentación', ver: 'ver-s07.html' },
    S08: { nombre: 'Apuntes S08 · El chasis', ver: 'ver-s08.html' },
    S09: { nombre: 'Apuntes S09 · Tarjetas de expansión y OEM frente a RETAIL', ver: 'ver-s09.html' },
    S11: { nombre: 'Apuntes S11 · Ampliaciones de equipo', ver: 'ver-s11.html' },
    S12: { nombre: 'Apuntes S12 · Diagnóstico guiado de averías', ver: 'ver-s12.html' }
  };
  const LETRAS = ['A', 'B', 'C', 'D'];
  const $ = (id) => document.getElementById(id);

  function barajar(lista) {
    const a = lista.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let items = [], i = 0, aciertos = 0, elegida = null, comprobada = false;

  /* Pregunta preparada: opciones en orden aleatorio y posición nueva de la correcta. */
  function preparar(q) {
    const orden = barajar([0, 1, 2, 3]);
    return {
      q,
      opciones: orden.map((k) => q.opciones[k]),
      correcta: orden.indexOf(q.correcta),
      elegida: null
    };
  }

  function empezar() {
    const valor = document.querySelector('input[name="n"]:checked').value;
    const todas = window.BANCO.length;
    const n = valor === 'todas' ? todas : Math.min(parseInt(valor, 10), todas);
    items = barajar(window.BANCO).slice(0, n).map(preparar);
    i = 0; aciertos = 0;
    $('inicio').hidden = true;
    $('resultado').hidden = true;
    $('prueba').hidden = false;
    mostrar();
    window.scrollTo(0, 0);
  }

  function mostrar() {
    const it = items[i];
    comprobada = false;
    elegida = null;
    $('contador').textContent = 'Pregunta ' + (i + 1) + ' de ' + items.length;
    $('aciertos').textContent = 'Aciertos: ' + aciertos;
    $('barra').style.width = ((i) / items.length * 100) + '%';
    $('fuente').textContent = APUNTES[it.q.fuente].nombre;
    $('pregunta').textContent = it.q.pregunta;
    const cont = $('opciones');
    cont.innerHTML = '';
    it.opciones.forEach((texto, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opcion';
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<span class="letra">' + LETRAS[k] + '</span><span></span>';
      b.lastChild.textContent = texto;
      b.onclick = () => elegir(k);
      cont.appendChild(b);
    });
    $('feedback').hidden = true;
    $('comprobar').hidden = false;
    $('comprobar').disabled = true;
    $('siguiente').hidden = true;
    $('siguiente').textContent = i + 1 < items.length ? 'Siguiente' : 'Ver resultado';
  }

  function elegir(k) {
    if (comprobada) return;
    elegida = k;
    items[i].elegida = k;
    document.querySelectorAll('.opcion').forEach((b, n) => b.setAttribute('aria-pressed', n === k ? 'true' : 'false'));
    $('comprobar').disabled = false;
  }

  function comprobar() {
    const it = items[i];
    comprobada = true;
    const acierto = elegida === it.correcta;
    if (acierto) aciertos++;
    document.querySelectorAll('.opcion').forEach((b, n) => {
      b.disabled = true;
      if (n === it.correcta) b.classList.add('correcta');
      if (n === elegida && !acierto) b.classList.add('fallo');
    });
    const f = $('feedback');
    f.className = 'feedback ' + (acierto ? 'ok' : 'mal');
    f.innerHTML = '';
    const titulo = document.createElement('strong');
    titulo.textContent = acierto ? 'Correcto' : 'No es esta. La correcta es: ' + LETRAS[it.correcta] + ') ' + it.opciones[it.correcta];
    const texto = document.createElement('p');
    texto.textContent = it.q.explica;
    const enlace = document.createElement('a');
    enlace.className = 'ver';
    enlace.href = 'apuntes/' + APUNTES[it.q.fuente].ver;
    enlace.textContent = 'Ver en ' + APUNTES[it.q.fuente].nombre.replace('Apuntes ', 'los apuntes ');
    f.append(titulo, texto, enlace);
    f.hidden = false;
    $('aciertos').textContent = 'Aciertos: ' + aciertos;
    $('comprobar').hidden = true;
    $('siguiente').hidden = false;
  }

  function siguiente() {
    if (i + 1 < items.length) { i++; mostrar(); window.scrollTo(0, 0); }
    else terminar();
  }

  function terminar() {
    const hechas = items.filter((x) => x.elegida !== null).length;
    const total = items.length;
    const nota = aciertos;
    const porcentaje = total ? Math.round(aciertos / total * 100) : 0;
    $('prueba').hidden = true;
    $('resultado').hidden = false;
    $('nota').textContent = nota + ' / ' + total;
    $('porcentaje').textContent = porcentaje + ' %';
    $('mensaje').textContent = porcentaje >= 80
      ? 'Muy buen resultado. Revisa los fallos: son los que más te van a costar en el examen.'
      : porcentaje >= 50
        ? 'Vas bien, pero repasa los apuntes de las preguntas que fallaste.'
        : 'Repasa los apuntes antes de otro simulacro. Usa los enlaces de cada pregunta.';
    if (hechas < total) $('mensaje').textContent += ' Has terminado antes de responder todas.';
    const lista = $('revision');
    lista.innerHTML = '';
    items.forEach((it, n) => {
      const acierto = it.elegida === it.correcta;
      const li = document.createElement('li');
      li.className = it.elegida === null ? '' : (acierto ? 'ok' : 'mal');
      const fuente = document.createElement('span');
      fuente.className = 'label';
      fuente.textContent = (n + 1) + '. ' + APUNTES[it.q.fuente].nombre;
      const p = document.createElement('p');
      p.className = 'p';
      p.textContent = it.q.pregunta;
      const r = document.createElement('p');
      r.className = 'r';
      if (it.elegida === null) {
        r.textContent = 'Sin responder. Correcta: ' + it.opciones[it.correcta];
      } else if (acierto) {
        r.textContent = 'Respuesta correcta: ' + it.opciones[it.correcta];
      } else {
        r.innerHTML = 'Tu respuesta: ' + it.opciones[it.elegida] + '. <b>Correcta: ' + it.opciones[it.correcta] + '.</b>';
      }
      const enlace = document.createElement('a');
      enlace.href = 'apuntes/' + APUNTES[it.q.fuente].ver;
      enlace.textContent = 'Repasar este apunte';
      li.append(fuente, p, r, enlace);
      lista.appendChild(li);
    });
    window.scrollTo(0, 0);
  }

  function volverAlInicio() {
    $('resultado').hidden = true;
    $('prueba').hidden = true;
    $('inicio').hidden = false;
    $('total').textContent = window.BANCO.length + ' preguntas en el banco.';
  }

  $('empezar').onclick = empezar;
  $('comprobar').onclick = comprobar;
  $('siguiente').onclick = siguiente;
  $('salir').onclick = terminar;
  $('repetir').onclick = volverAlInicio;
  $('total').textContent = window.BANCO.length + ' preguntas en el banco.';

  /* Tema claro/oscuro: misma clave que el temario. */
  function temaActual() {
    const t = document.documentElement.dataset.theme;
    return t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  const SOL = '<svg viewBox="0 0 24 24" aria-hidden="true" class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const LUNA = '<svg viewBox="0 0 24 24" aria-hidden="true" class="moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function pintarTema() {
    const oscuro = temaActual() === 'dark';
    const btn = $('tema');
    btn.innerHTML = oscuro ? SOL : LUNA;
    const texto = oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
    btn.setAttribute('aria-label', texto);
    btn.title = texto;
  }
  $('tema').onclick = () => {
    const nuevo = temaActual() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nuevo;
    try { localStorage.setItem('temario-tema', nuevo); } catch (_) {}
    pintarTema();
  };
  pintarTema();
  volverAlInicio();
})();
</script>
</body>
</html>
