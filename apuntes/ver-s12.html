<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apuntes S12 · Diagnóstico guiado de averías · Microinformática</title>
<script>
  (() => {
    try {
      const saved = localStorage.getItem("temario-tema");
      if (saved === "dark" || saved === "light") { document.documentElement.dataset.theme = saved; return; }
    } catch (_) {}
    document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  })();
</script>
<style>
:root{color-scheme:dark;--bg:#2E3440;--surface:#3B4252;--text:#ECEFF4;--muted:#D8DEE9;--border:#596579;--accent:#88C0D0;--accent-text:#2E3440;--focus:#88C0D0;}
html[data-theme="light"]{color-scheme:light;--bg:#ECEFF4;--surface:#E5E9F0;--text:#2E3440;--muted:#434C5E;--border:#A0AAB9;--accent:#5E81AC;--accent-text:#FFFFFF;--focus:#5E81AC;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border)}
header a.volver{color:var(--muted);text-decoration:none;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
header a.volver:hover{color:var(--accent)}
h1{font-size:17px;margin:0;font-weight:700}
.acciones{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-weight:600;text-decoration:none}
.btn.principal{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn:hover{border-color:var(--accent)}
main{flex:1;display:flex;flex-direction:column}
iframe{flex:1;width:100%;min-height:72vh;border:0;background:#fff}
.ayuda{padding:12px 20px;color:var(--muted);font-size:14px;margin:0}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <a class="volver" href="../index.html">← Temario</a>
    <h1>Apuntes S12 · Diagnóstico guiado de averías</h1>
  </div>
  <div class="acciones">
    <a class="btn" href="s12-diagnostico-guiado.pdf" target="_blank" rel="noopener">Abrir en pestaña</a>
    <a class="btn principal" href="s12-diagnostico-guiado.pdf" download>Descargar PDF</a>
  </div>
</header>
<main>
  <iframe src="s12-diagnostico-guiado.pdf" title="Apuntes S12 · Diagnóstico guiado de averías"></iframe>
  <p class="ayuda">Si el documento no se muestra aquí, usa «Abrir en pestaña» o «Descargar PDF».</p>
</main>
</body>
</html>
