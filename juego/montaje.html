<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:,">
  <title>Montaje del equipo · Microinformática</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("temario-tema");
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.theme = saved;
          return;
        }
      } catch (_) {}
      document.documentElement.dataset.theme =
        matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #2E3440;
      --surface: #3B4252;
      --surface-2: #434C5E;
      --text: #ECEFF4;
      --muted: #D8DEE9;
      --border: #596579;
      --accent: #88C0D0;
      --accent-text: #24313A;
      --ok: #A3BE8C;
      --bad: #E0868E;
      --warn: #EBCB8B;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #ECEFF4;
      --surface: #E5E9F0;
      --surface-2: #D8DEE9;
      --text: #2E3440;
      --muted: #434C5E;
      --border: #A0AAB9;
      --accent: #5E81AC;
      --accent-text: #FFFFFF;
      --ok: #426B35;
      --bad: #A3414A;
      --warn: #76530B;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 18px; }
    header a { color: var(--muted); text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
    header a:hover { color: var(--accent); }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
    }
    .escena-wrap { display: grid; gap: 12px; min-width: 0; }
    #escena {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #2E3440;
      touch-action: none;
    }
    #escena canvas { display: block; width: 100%; height: 100%; }
    @media (max-width: 480px) {
      #escena { aspect-ratio: 4 / 3; }
    }
    .bandeja {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .bandeja h2 { grid-column: 1 / -1; margin: 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .ficha {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .ficha:active { cursor: grabbing; }
    .ficha:hover { border-color: var(--accent); }
    .ficha i {
      flex: none;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, .35);
    }
    .ficha[aria-disabled="true"] { opacity: .4; cursor: default; }
    .miniatura {
      position: relative;
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 6px;
      background: var(--surface);
      overflow: hidden;
    }
    .miniatura img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 3px; }
    .ficha.destacar {
      border-color: var(--warn);
      box-shadow: 0 0 0 2px var(--warn);
    }
    #fantasma {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 10;
      pointer-events: none;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 13px;
      font-weight: 700;
      transform: translate(-50%, -50%);
      display: none;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      align-self: start;
    }
    .pedido-sel { display: grid; gap: 4px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
    .pedido-sel select { font: inherit; min-height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); padding: 4px 8px; }
    .cliente { margin: 0 0 14px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 6px; font-size: 14px; font-style: italic; }
    .obj { margin: 0 0 6px; font-weight: 700; font-size: 17px; }
    .prog { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    button.boton {
      font: inherit;
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
    }
    button.boton:hover { border-color: var(--accent); }
    button.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
    h2.titulo { font-size: 14px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .log {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 340px;
      overflow: auto;
      font-size: 14px;
    }
    .log li { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .log .bad { color: var(--bad); }
    .log .ok { color: var(--ok); }
    .log .info { color: var(--muted); }
    .ayuda { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
  </style>
</head>
<body>
  <header>
    <a href="../index.html">← Temario</a>
    <h1>Montaje del equipo</h1>
    <button id="tema" class="boton" type="button" aria-label="Cambiar tema">Tema</button>
  </header>

  <main class="layout">
    <section class="escena-wrap" aria-label="Escena de montaje">
      <div id="escena" role="img" aria-label="Chasis abierto con placa base y componentes en 3D"></div>
      <div id="bandeja" class="bandeja">
        <h2>Piezas y cables</h2>
      </div>
    </section>

    <aside class="panel">
      <label class="pedido-sel">Pedido
        <select id="pedido"></select>
      </label>
      <label class="pedido-sel">Modo
        <select id="modo">
          <option value="normal">Normal (con pistas)</option>
          <option value="dificil">Difícil (sin pistas)</option>
        </select>
      </label>
      <p class="cliente" id="cliente"></p>
      <p class="obj" id="objetivo"></p>
      <p class="prog" id="progreso"></p>
      <div class="acciones">
        <button id="encender" class="boton primario" type="button">Encender el equipo</button>
        <button id="reiniciar" class="boton" type="button">Empezar de nuevo</button>
      </div>
      <h2 class="titulo">Registro</h2>
      <ul id="log" class="log" aria-live="polite"></ul>
      <p class="ayuda">Arrastra cada pieza de la bandeja al hueco que le corresponde en el chasis. Los cables se conectan arrastrándolos a su conector.</p>
    </aside>
  </main>

  <div id="fantasma"></div>

  <script type="module" src="montaje.js"></script>
</body>
</html>
