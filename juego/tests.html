<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas de reglas · Montaje</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; background: #2E3440; color: #ECEFF4; }
    li.ok { color: #A3BE8C; } li.fallo { color: #E0868E; }
    h1 { font-size: 18px; }
  </style>
</head>
<body>
  <h1>Pruebas de las reglas del montaje</h1>
  <p id="resumen">Ejecutando…</p>
  <ul id="lista"></ul>
  <script type="module">
    import { potenciaNecesaria, comprobarColocacion, longitudPuntos } from './reglas.js';
    import { PIEZAS, CABLES, PEDIDOS, PLATAFORMAS, PSUS, GPUS } from './catalogo.js';
    import { SLOTS, PORTS, NECESITA, SALIDA_CABLE } from './geometria.js';

    const resultados = [];
    const comprobar = (nombre, condicion) => resultados.push({ nombre, ok: !!condicion });
    const pieza = (id) => PIEZAS.find((p) => p.id === id);

    // Potencia: (TDP CPU + TDP GPU + 100) × 1,3
    comprobar('potencia AM4 (105 W + 150 W)', potenciaNecesaria(105, 150) === 462);
    comprobar('potencia Intel i7 (125 W + 150 W)', potenciaNecesaria(125, 150) === 488);

    // Longitud de un recorrido
    comprobar('longitud de un tramo recto de 10', longitudPuntos([[0, 0, 0], [10, 0, 0]]) === 10);
    comprobar('longitud de dos tramos (3-4-5)', Math.abs(longitudPuntos([[0, 0, 0], [3, 4, 0]]) - 5) < 1e-9);

    // Colocación: casos de referencia
    const placaAM4 = pieza('board-am4');
    const base = { placa: placaAM4, cajaPuesta: true, ocupado: false, nombreHueco: 'socket', cpuTdp: 105, tdpGpu: 150, enPedido: true };
    comprobar('CPU AM4 en placa AM4 se acepta', comprobarColocacion({ ...base, pieza: pieza('cpu-am4') }).ok);
    comprobar('CPU Intel en placa AM4 se rechaza', !comprobarColocacion({ ...base, pieza: pieza('cpu-intel') }).ok);
    comprobar('RAM DDR5 en placa DDR4 se rechaza', !comprobarColocacion({ ...base, pieza: pieza('ram-x') }).ok);
    comprobar('fuente de 450 W con 105+150 W se rechaza', !comprobarColocacion({ ...base, pieza: pieza('psu-x') }).ok);
    comprobar('fuente de 650 W se acepta', comprobarColocacion({ ...base, pieza: pieza('psu') }).ok);
    comprobar('pieza sin caja se rechaza', !comprobarColocacion({ ...base, cajaPuesta: false, pieza: pieza('cpu-am4') }).ok);
    comprobar('pieza sin placa se rechaza', !comprobarColocacion({ ...base, placa: null, pieza: pieza('cpu-am4') }).ok);
    comprobar('hueco ocupado se rechaza', !comprobarColocacion({ ...base, ocupado: true, pieza: pieza('cpu-am4') }).ok);
    comprobar('pieza fuera del pedido se rechaza', !comprobarColocacion({ ...base, enPedido: false, pieza: pieza('cpu-am4') }).ok);
    comprobar('el rechazo trae motivo y versión corta', (() => { const r = comprobarColocacion({ ...base, pieza: pieza('cpu-intel') }); return !!r.motivo && !!r.corto; })());

    // Catálogo: cada pedido (fijo o aleatorio) debe poder montarse
    const idsValidos = new Set(PIEZAS.map((p) => p.id));
    for (const ped of PEDIDOS) {
      const pz = ped.piezas;
      const b = pieza(pz.board), c = pieza(pz.cpu), g = pieza(pz.gpu), f = pieza(pz.psu), k = pieza(pz.caja);
      const piezas = [pz.caja, pz.board, pz.cpu, ...pz.ram, pz.gpu, pz.nvme, pz.psu];
      comprobar(`${ped.id}: todas las piezas existen`, piezas.every((id) => idsValidos.has(id)));
      comprobar(`${ped.id}: CPU y placa del mismo socket`, c.socket === b.socket);
      comprobar(`${ped.id}: memoria de la generación de la placa`, pz.ram.every((id) => pieza(id).gen === b.gen));
      comprobar(`${ped.id}: fuente suficiente`, f.watts >= potenciaNecesaria(c.tdp, g.tdp));
      comprobar(`${ped.id}: caja válida`, k && k.kind === 'caja');
    }
    comprobar('hay al menos 13 pedidos', PEDIDOS.length >= 13);
    comprobar('cables con longitud máxima', CABLES.every((c) => c.longitudMax > 0));

    // Geometría: huecos, conectores y salidas de cable coherentes
    const tipos = new Set(PIEZAS.map((p) => p.kind).concat(['cable']));
    comprobar('cada hueco acepta tipos conocidos', Object.values(SLOTS).every((h) => h.accepts.every((t) => PIEZAS.some((p) => p.kind === t))));
    comprobar('cada conector tiene la pieza que lo necesita', Object.keys(PORTS).every((pid) => tipos.has(NECESITA[pid]) || PIEZAS.some((p) => p.kind === NECESITA[pid])));
    comprobar('cada cable tiene su conector y su salida', CABLES.every((c) => PORTS[c.port] && SALIDA_CABLE[c.id]));
    comprobar('los huecos de la placa están dentro de ella (la fuente va delante)', Object.values(SLOTS).filter((h) => h.nombre !== 'chasis' && h.nombre !== 'hueco de la fuente').every((h) => Math.abs(h.x) < 15 && Math.abs(h.y) < 12));

    // Nombres: toda pieza tiene nombre comercial (en modo difícil) y todo cable su nombre completo
    comprobar('todas las piezas tienen nombre comercial', PIEZAS.every((p) => typeof p.comercial === 'string' && p.comercial.length > 0));
    comprobar('todos los cables tienen nombre', CABLES.every((c) => typeof c.nombre === 'string' && c.nombre.length > 0));

    const fallos = resultados.filter((r) => !r.ok);
    document.getElementById('resumen').textContent = fallos.length
      ? `${fallos.length} de ${resultados.length} pruebas fallan`
      : `Todas las pruebas pasan (${resultados.length})`;
    const lista = document.getElementById('lista');
    for (const r of resultados) {
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'fallo';
      li.textContent = (r.ok ? 'OK  ' : 'FALLA  ') + r.nombre;
      lista.appendChild(li);
    }
  </script>
</body>
</html>
