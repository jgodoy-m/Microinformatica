<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulador y mapa de averías</title>
<style>
/* Tema Nord. Paleta: Polar Night (nord0-3) y Snow Storm (nord4-6) para superficies y texto;
   Frost (nord7-10) para acentos y foco; Aurora (nord11-15) para estados.
   Los tonos de texto de estado en modo claro son versiones más oscuras de Aurora para mantener 4.5:1. */
:root{
  color-scheme:light;
  --bg:#ECEFF4;          /* nord6 */
  --card:#E5E9F0;        /* nord5 */
  --fg:#2E3440;          /* nord0 */
  --muted:#4C566A;       /* nord3 */
  --line:#D8DEE9;        /* nord4 */
  --rack:#3B4252;        /* nord1 */
  --rack-fg:#ECEFF4;     /* nord6 */
  --rack-muted:#D8DEE9;  /* nord4 */
  --btn:#E5E9F0;
  --accent:#88C0D0;      /* nord8 */
  --accent-ink:#2E3440;  /* nord0 */
  --focus:#5E81AC;       /* nord10 */
  --ok:#4F6B3A;          /* nord14 oscurecido */
  --bad:#A3414A;         /* nord11 oscurecido */
  --warn:#EBCB8B;        /* nord13 */
  --lamp-ok:#A3BE8C;     /* nord14 */
  --lamp-bad:#BF616A;    /* nord11 */
  --off:#4C566A;         /* nord3 */
  --bar:#434C5E;         /* nord2 */
  --photo-bg:#2E3440;    /* nord0 */
  --zone-hover:rgba(136,192,208,.30);
  --zone-hit:rgba(163,190,140,.45);
  --zone-miss:rgba(191,97,106,.50);
  --zone-pulse:rgba(235,203,139,.25);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r:8px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#2E3440;        /* nord0 */
    --card:#3B4252;      /* nord1 */
    --fg:#ECEFF4;        /* nord6 */
    --muted:#D8DEE9;     /* nord4 */
    --line:#434C5E;      /* nord2 */
    --rack:#242933;      /* nord0 oscurecido, para que el panel destaque sobre la tarjeta */
    --rack-fg:#ECEFF4;
    --rack-muted:#D8DEE9;
    --btn:#434C5E;       /* nord2 */
    --accent:#88C0D0;
    --accent-ink:#2E3440;
    --focus:#88C0D0;
    --ok:#A3BE8C;
    --bad:#E0868E;       /* nord11 aclarado */
    --lamp-ok:#A3BE8C;
    --lamp-bad:#BF616A;
    --off:#4C566A;
    --bar:#434C5E;
    --photo-bg:#242933;
    --zone-hover:rgba(136,192,208,.32);
    --zone-hit:rgba(163,190,140,.40);
    --zone-miss:rgba(191,97,106,.50);
    --zone-pulse:rgba(235,203,139,.22);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#2E3440;
  --card:#3B4252;
  --fg:#ECEFF4;
  --muted:#D8DEE9;
  --line:#434C5E;
  --rack:#242933;
  --rack-fg:#ECEFF4;
  --rack-muted:#D8DEE9;
  --btn:#434C5E;
  --accent:#88C0D0;
  --accent-ink:#2E3440;
  --focus:#88C0D0;
  --ok:#A3BE8C;
  --bad:#E0868E;
  --lamp-ok:#A3BE8C;
  --lamp-bad:#BF616A;
  --off:#4C566A;
  --bar:#434C5E;
  --photo-bg:#242933;
  --zone-hover:rgba(136,192,208,.32);
  --zone-hit:rgba(163,190,140,.40);
  --zone-miss:rgba(191,97,106,.50);
  --zone-pulse:rgba(235,203,139,.22);
}

*{box-sizing:border-box}
html{scroll-padding-top:var(--s4)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%;height:auto}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

#app{max-width:1080px;margin:0 auto;padding:var(--s5) var(--s4) var(--s6)}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin-bottom:var(--s2)}
h2{font-size:22px;line-height:1.25;font-weight:700;margin:var(--s2) 0}
.intro{color:var(--muted);max-width:60ch;margin-bottom:var(--s5)}
.label{font:600 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:var(--s4) 0 var(--s2)}
.label:first-child{margin-top:0}
.val{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Navegación de temas (aparece con más de un tema) */
.temas{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s4)}
.tema{font:600 14px/1.2 var(--sans);padding:var(--s2) var(--s3);min-height:40px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);cursor:pointer}
.tema:hover{border-color:var(--accent)}
.tema[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Pestañas */
.tabs{display:flex;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:var(--s1);gap:var(--s1);margin-bottom:var(--s5)}
.tabs button{flex:1;min-width:0;min-height:44px;background:none;border:0;border-radius:6px;padding:var(--s2) var(--s3);font:600 15px var(--sans);color:var(--fg);cursor:pointer}
.tabs button:hover{background:var(--btn)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible{outline-offset:-3px}
.panel{display:none}
.panel.on{display:block}

/* Superficies */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);margin-bottom:var(--s4)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s2)}
.caso-n{font:600 14px var(--sans);color:var(--muted)}
.coste{font-family:var(--mono);font-size:13px;color:var(--muted)}
.foot{font-size:14px;line-height:1.5;color:var(--muted);margin-top:var(--s3)}

/* Simulador */
.sim-stage{display:grid;grid-template-columns:1fr;gap:var(--s4)}
@media(min-width:800px){
  .sim-stage{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start}
  .sim-izq{position:sticky;top:var(--s4)}
}
.rack{background:var(--rack);color:var(--rack-fg);border-radius:var(--r);padding:var(--s4)}
.rack-titulo{font:600 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--rack-muted);margin-bottom:var(--s4)}
.lamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2)}
.lamp{text-align:center;font:600 11px/1.2 var(--sans);letter-spacing:.04em;color:var(--rack-muted)}
.lamp i{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto var(--s2);background:var(--off);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:background .4s,box-shadow .4s}
.lamp.ok i{background:var(--lamp-ok);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.45)}
.lamp.bad i{background:var(--lamp-bad);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.45)}
.volts{margin-top:var(--s4);display:grid;gap:var(--s2)}
.vb{display:grid;grid-template-columns:56px minmax(0,1fr) 68px;align-items:center;gap:var(--s2);font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.vb .bar{height:10px;background:var(--bar);position:relative;overflow:hidden;border-radius:2px}
.vb .bar b{position:absolute;inset:0 auto 0 0;width:0;background:var(--lamp-ok);transition:width .8s ease}
.vb.bad .bar b{background:var(--lamp-bad)}
.vb.bad .val{color:#E0868E}
.vnote{font-size:13px;color:var(--rack-muted);min-height:20px;margin-top:var(--s1)}

.btns{display:grid;grid-template-columns:1fr;gap:var(--s2)}
@media(min-width:560px){.btns{grid-template-columns:1fr 1fr}}
button{font-family:inherit}
button.act{font:500 15px/1.3 var(--sans);background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3);min-height:44px;text-align:left;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
button.act:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.act:disabled{opacity:.5;cursor:default}
.log{border-top:1px solid var(--line);margin-top:var(--s3);padding-top:var(--s3);min-height:56px}
.log p{margin:0 0 var(--s2)}
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.next{margin-top:var(--s3);font:600 15px var(--sans);background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:var(--r);padding:var(--s2) var(--s4);min-height:44px;cursor:pointer}
.next:hover{filter:brightness(1.08)}

/* Mapa */
.modes{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.modes button{font:600 14px var(--sans);min-height:40px;padding:var(--s2) var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--btn);color:var(--fg);cursor:pointer}
.modes button:hover{border-color:var(--accent)}
.modes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modes .qScore{margin-left:auto;font-size:13px;color:var(--muted)}
.map{margin:0}
svg.mapa{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:var(--r);background:var(--photo-bg)}
svg.mapa .z{cursor:pointer;outline:none}
svg.mapa .z rect{fill:transparent;stroke:transparent;stroke-width:2;vector-effect:non-scaling-stroke;rx:6;transition:fill .2s,stroke .2s}
svg.mapa .z:hover rect{fill:var(--zone-hover);stroke:var(--accent)}
svg.mapa .z:focus-visible rect{fill:var(--zone-hover);stroke:var(--accent);stroke-width:4}
svg.mapa .z.hit rect{fill:var(--zone-hit);stroke:var(--lamp-ok)}
svg.mapa .z.miss rect{fill:var(--zone-miss);stroke:var(--lamp-bad)}
svg.mapa .z.pulse rect{fill:var(--zone-pulse);stroke:var(--warn);stroke-width:3}
@media (prefers-reduced-motion: no-preference){svg.mapa .z.pulse rect{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s3);font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:var(--s1)}
.sw{width:12px;height:12px;display:inline-block;border:1px solid var(--line);border-radius:2px}
.sw-hover{background:var(--zone-hover)}
.sw-hit{background:var(--zone-hit)}
.sw-miss{background:var(--zone-miss)}
.info{font-size:16px;min-height:48px}
.info-d{margin-top:var(--s1)}
.credit{font-size:13px;line-height:1.5;color:var(--muted);margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line)}
.credit a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}

/* Cabecera: botón de tema */
.barra{display:flex;justify-content:flex-end;align-items:center;gap:var(--s4);margin-bottom:var(--s3)}
.inicio-link{font-size:14px;color:var(--muted);text-decoration:none;margin-right:auto}
.inicio-link:hover{color:var(--accent)}
.tema-btn{display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);cursor:pointer}
.tema-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tema-btn:hover{border-color:var(--accent);background:var(--btn)}

/* Explicación al resolver una avería */
.explicacion{border-top:1px solid var(--line);margin-top:var(--s3);padding-top:var(--s1)}
.explicacion .label{margin-top:var(--s3)}
.explicacion dl{margin:0}
.explicacion dt{font-weight:700;margin-top:var(--s3)}
.explicacion dd{margin:var(--s1) 0 0;color:var(--fg)}

/* Repaso final */
.repaso{margin:0;padding-left:var(--s5)}
.repaso li{margin-bottom:var(--s3)}
.repaso-t{font-weight:700}
.repaso p{margin:var(--s1) 0 0;color:var(--muted)}

/* Móvil: sin scroll horizontal y con margen de 16 px */
@media (max-width:480px){
  #app{padding:var(--s4) var(--s4) var(--s5)}
  .card{padding:var(--s4)}
  .modes .qScore{width:100%;margin-left:0}
}
</style>
</head>
<body>
<main id="app"></main>
<script src="js/motor.js"></script>
<script src="temas/placa-base.js"></script>
<script>
  Temario.iniciar(document.getElementById('app'), window.TEMAS);
</script>
</body>
</html>
