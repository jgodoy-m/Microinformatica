<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulador y mapa de averías</title>
  <meta name="description" content="Simulador de averías y mapa de conectores de una placa base, para practicar el diagnóstico paso a paso.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%276%27%20fill%3D%27%232E3440%27%2F%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%2388C0D0%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%3E%3Crect%20x%3D%277%27%20y%3D%277%27%20width%3D%2718%27%20height%3D%2718%27%20rx%3D%273%27%2F%3E%3Cpath%20d%3D%27M12%2012h8v8h-8zM12%202v3M20%202v3M12%2027v3M20%2027v3M2%2012h3M2%2020h3M27%2012h3M27%2020h3%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
/* Tema Nord. Paleta: Polar Night (nord0-3) y Snow Storm (nord4-6) para superficies y texto;
   Frost (nord7-10) para acentos y foco; Aurora (nord11-15) para estados.
   Los tonos de texto de estado en modo claro son versiones más oscuras de Aurora para mantener 4.5:1. */
:root{
  /* Tema oscuro azul marino (Nord Polar Night + acentos Frost/Aurora). Es el modo por defecto. */
  color-scheme:dark;
  --bg:#2E3440;          /* nord0: fondo general */
  --card:#3B4252;        /* nord1: paneles */
  --card-2:#434C5E;      /* nord2: superficies interactivas */
  --line:#4C566A;        /* nord3: bordes */
  --fg:#ECEFF4;          /* nord6: texto principal */
  --muted:#D8DEE9;       /* nord4: texto secundario */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r:8px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --rack:#242933;        /* panel de estado, más oscuro que las tarjetas */
  --rack-fg:#ECEFF4;
  --rack-muted:#D8DEE9;
  --btn:#434C5E;
  --accent:#88C0D0;      /* nord8: interacción y énfasis */
  --accent-ink:#2E3440;
  --focus:#88C0D0;
  --ok:#A3BE8C;          /* nord14: verificación correcta */
  --bad:#E0868E;         /* nord11 aclarado para texto legible */
  --warn:#EBCB8B;        /* nord13: advertencias */
  --lamp-ok:#A3BE8C;
  --lamp-bad:#BF616A;
  --off:#4C566A;
  --bar:#434C5E;
  --photo-bg:#242933;
  --zone-hover:rgba(136,192,208,.32);
  --zone-hit:rgba(163,190,140,.40);
  --zone-miss:rgba(191,97,106,.50);
  --zone-pulse:rgba(235,203,139,.22);
}
/* Modo claro: solo si se activa con data-theme="light"; el tema oscuro es el predeterminado. */
:root[data-theme="light"]{color-scheme:light;--bg:#ECEFF4;--card:#E5E9F0;--card-2:#D8DEE9;--line:#D8DEE9;--fg:#2E3440;--muted:#4C566A;--rack:#3B4252;--rack-fg:#ECEFF4;--rack-muted:#D8DEE9;--btn:#E5E9F0;--accent:#88C0D0;--accent-ink:#2E3440;--focus:#5E81AC;--ok:#4F6B3A;--bad:#A3414A;--warn:#EBCB8B;--lamp-ok:#A3BE8C;--lamp-bad:#BF616A;--off:#4C566A;--bar:#434C5E;--photo-bg:#2E3440;--zone-hover:rgba(136,192,208,.30);--zone-hit:rgba(163,190,140,.45);--zone-miss:rgba(191,97,106,.50);--zone-pulse:rgba(235,203,139,.25);}


*{box-sizing:border-box}
html{scroll-padding-top:var(--s4)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%;height:auto}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

#app{margin:0}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin-bottom:var(--s2)}
h2{font-size:22px;line-height:1.25;font-weight:700;margin:var(--s2) 0}
.intro{color:var(--muted);max-width:60ch;margin-bottom:var(--s5)}
.label{font:600 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:var(--s4) 0 var(--s2)}
.label:first-child{margin-top:0}
.val{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Navegación de temas (aparece con más de un tema) */
.temas{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s4)}
.tema{font:600 14px/1.2 var(--sans);padding:var(--s2) var(--s3);min-height:40px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);cursor:pointer}
.tema:hover{border-color:var(--accent)}
.tema[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Superficies */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);margin-bottom:var(--s4)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s2)}
.caso-n{font:600 14px var(--sans);color:var(--muted)}
.coste{font-family:var(--mono);font-size:13px;color:var(--muted)}
.foot{font-size:14px;line-height:1.5;color:var(--muted);margin-top:var(--s3)}

/* Mapa */
.modes{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.modes button{font:600 14px var(--sans);min-height:40px;padding:var(--s2) var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--btn);color:var(--fg);cursor:pointer}
.modes button:hover{border-color:var(--accent)}
.modes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modes .qScore{margin-left:auto;font-size:13px;color:var(--muted)}
.map{margin:0}
svg.mapa{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:var(--r);background:var(--photo-bg)}
svg.mapa .z{cursor:pointer;outline:none}
svg.mapa .z rect{fill:transparent;stroke:transparent;stroke-width:2;vector-effect:non-scaling-stroke;rx:6;transition:fill .2s,stroke .2s}
svg.mapa .z:hover rect{fill:var(--zone-hover);stroke:var(--accent)}
svg.mapa .z:focus-visible rect{fill:var(--zone-hover);stroke:var(--accent);stroke-width:4}
svg.mapa .z.hit rect{fill:var(--zone-hit);stroke:var(--lamp-ok)}
svg.mapa .z.miss rect{fill:var(--zone-miss);stroke:var(--lamp-bad)}
svg.mapa .z.pulse rect{fill:var(--zone-pulse);stroke:var(--warn);stroke-width:3}
@media (prefers-reduced-motion: no-preference){svg.mapa .z.pulse rect{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s3);font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:var(--s1)}
.sw{width:12px;height:12px;display:inline-block;border:1px solid var(--line);border-radius:2px}
.sw-hover{background:var(--zone-hover)}
.sw-hit{background:var(--zone-hit)}
.sw-miss{background:var(--zone-miss)}
.info{font-size:16px;min-height:48px}
.info-d{margin-top:var(--s1)}
.info button{display:block;margin-top:var(--s3);font:600 15px var(--sans);min-height:44px;padding:var(--s2) var(--s4);border:1px solid var(--accent);border-radius:var(--r);background:var(--btn);color:var(--fg);cursor:pointer}
.info button:hover{background:var(--card-2)}
.credit{font-size:13px;line-height:1.5;color:var(--muted);margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line)}
.credit a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}

/* Explicación al resolver una avería */
.explicacion{border-top:1px solid var(--line);margin-top:var(--s3);padding-top:var(--s1)}
.explicacion .label{margin-top:var(--s3)}
.explicacion dl{margin:0}
.explicacion dt{font-weight:700;margin-top:var(--s3)}
.explicacion dd{margin:var(--s1) 0 0;color:var(--fg)}

/* Repaso final */
.repaso{margin:0;padding-left:var(--s5)}
.repaso li{margin-bottom:var(--s3)}
.repaso-t{font-weight:700}
.repaso p{margin:var(--s1) 0 0;color:var(--muted)}

/* Móvil: sin scroll horizontal y con margen de 16 px */
@media (max-width:480px){
  #app{padding:var(--s4) var(--s4) var(--s5)}
  .card{padding:var(--s4)}
  .modes .qScore{width:100%;margin-left:0}
}
/* Mecánicas: pistas, avisos y desglose de puntuación */
.aviso{color:var(--warn);font-weight:700}
.desglose{list-style:none;margin:6px 0 8px;padding:0;display:grid;gap:2px;font-size:13px;color:var(--muted)}
.desglose li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:2px 0}
.desglose .val{font-family:ui-monospace,Menlo,Consolas,monospace}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- Diseño del simulador: barra lateral, pasos, pruebas y panel de estado ---------- */
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--rack);border-right:1px solid var(--line);padding:var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s5)}
.marca{display:flex;align-items:center;gap:var(--s3)}
.marca svg{width:36px;height:36px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.marca b{display:block;font-size:15px;line-height:1.2}
.marca small{display:block;color:var(--muted);font-size:13px}
.nav,.side-pie{display:grid;gap:var(--s1)}
.side-pie{margin-top:auto}
.nav-item{display:block;width:100%;text-align:left;font:600 15px var(--sans);color:var(--fg);background:none;border:0;border-left:3px solid transparent;border-radius:6px;padding:var(--s2) var(--s3);min-height:44px;cursor:pointer}
.nav-item:hover{background:var(--card)}
.nav-item[aria-current="page"]{background:var(--card-2);border-left-color:var(--accent);color:var(--accent)}
.fila-switch span{white-space:nowrap}
.fila-switch{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);font:600 15px var(--sans);padding:var(--s2) var(--s3);min-height:44px}
.switch{position:relative;flex:none;width:44px;height:24px;padding:0;border:1px solid var(--line);border-radius:999px;background:var(--card-2);cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent-ink)}
.principal{min-width:0;padding:var(--s3) var(--s4) var(--s5)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3) var(--s4);flex-wrap:wrap;margin-bottom:var(--s4)}
.volver{font-size:14px;color:var(--muted);text-decoration:none}
.volver:hover{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:14px;color:var(--muted)}
.stats span{padding-left:var(--s4);border-left:1px solid var(--line)}
.stats span:first-child{padding-left:0;border-left:0}
.stats b{color:var(--fg);font-family:var(--mono);font-weight:600}
.cabecera-pag{margin-bottom:var(--s3)}
.cabecera-pag h1{font-size:26px;margin:0 0 var(--s1)}
.cabecera-pag .intro{margin:0;max-width:70ch}
.pasos{list-style:none;margin:0 0 var(--s3);padding:var(--s2) var(--s4);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s1);background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.paso{position:relative;display:grid;justify-items:center;gap:var(--s2);text-align:center;font:600 13px/1.2 var(--sans);color:var(--muted)}
.paso::before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--line)}
.paso:first-child::before{display:none}
.paso-n{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line);color:var(--fg);font-family:var(--mono)}
.paso.hecho .paso-n,.paso.actual .paso-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.paso.actual{color:var(--fg)}
.paso.actual .paso-n{box-shadow:0 0 0 4px rgba(136,192,208,.25)}
.paso-t{position:relative;z-index:1}
.caso-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3);align-items:start}
.caso-wrap .card{padding:var(--s3) var(--s4)}
.caso-col,.caso-der{display:grid;gap:var(--s3);min-width:0}
.caso-der .card,.caso-col .card{margin:0}
.cabecera .cab-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap}
.cabecera h2.caso-t{margin:0;font-size:19px}
.badge{font:600 13px var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:var(--s1) var(--s3);white-space:nowrap}
.cabecera .caso-s{margin:var(--s1) 0 0;color:var(--muted);max-width:70ch;font-size:15px}
.tabs-u{display:flex;gap:var(--s1);border-bottom:1px solid var(--line)}
.tab-u{font:600 15px var(--sans);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:var(--s1) var(--s3);min-height:44px;cursor:pointer}
.tab-u:hover{color:var(--fg)}
.tab-u[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.acts{display:grid;gap:var(--s2)}
@media (min-width:1400px){.acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
button.prueba{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:var(--s2);width:100%;min-height:44px;padding:6px var(--s3);line-height:1.2;text-align:left;font:inherit;color:var(--fg);background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
button.prueba:hover:not(:disabled){border-color:var(--accent)}
button.prueba:disabled{opacity:.55;cursor:default}
button.prueba .ui-txt{display:grid;gap:1px;min-width:0}
button.prueba .ui-txt b{font-weight:600;font-size:15px;line-height:1.25}
button.prueba .ui-txt small{font-size:12.5px;line-height:1.25;color:var(--muted)}
button.prueba .ui-usar{font:600 13px var(--sans);color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:2px var(--s2);white-space:nowrap}
button.prueba:disabled .ui-usar{color:var(--muted);border-color:var(--line)}
button.prueba .ui-chev{font-size:22px;line-height:1;color:var(--muted)}
.ui-ico{display:inline-grid;place-items:center;width:28px;height:28px;flex:none;border-radius:var(--r);background:var(--card);color:var(--accent)}
.ui-ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.log{min-height:120px;max-height:420px;overflow-y:auto}
.log p{margin:0 0 var(--s2)}
.ultima .label{margin-top:0}
.ultima-vacia{margin:0;color:var(--muted)}
.ultima-fila{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:start}
.ultima-txt p{margin:var(--s1) 0 0;color:var(--muted)}
.pill{font:600 12px var(--sans);white-space:nowrap;padding:var(--s1) var(--s3);border-radius:999px;border:1px solid var(--line);background:var(--card-2);color:var(--muted)}
.pill-bad{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.acciones-caso{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s3)}
.btn-sec,.btn-prim{font:600 15px var(--sans);min-height:44px;padding:var(--s2) var(--s4);border-radius:var(--r);cursor:pointer}
.btn-sec{color:var(--fg);background:var(--card-2);border:1px solid var(--line)}
.btn-sec:hover:not(:disabled){border-color:var(--accent)}
.btn-prim{color:var(--accent-ink);background:var(--accent);border:1px solid var(--accent)}
.btn-prim:hover:not(:disabled){filter:brightness(1.08)}
.btn-sec:disabled,.btn-prim:disabled{opacity:.5;cursor:default}
.btn-prim:disabled{background:var(--card-2);border-color:var(--line);color:var(--muted)}
.porque{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s1) var(--s4)}
.porque summary{display:flex;align-items:center;min-height:40px;font:600 15px var(--sans);cursor:pointer;list-style:none}
.porque summary::-webkit-details-marker{display:none}
.porque summary::after{content:"⌄";margin-left:auto;color:var(--muted)}
.porque[open] summary::after{content:"⌃"}
.porque .explicacion{margin:0 0 var(--s3);padding:0;border-top:0}
.porque .label{margin-top:var(--s3)}
.foto-placa{margin:0 0 var(--s3)}
.foto-placa img{display:block;width:100%;height:72px;object-fit:cover;object-position:50% 40%;border-radius:var(--r);border:1px solid var(--line)}
.lamps,.volts{list-style:none;margin:0;padding:0;display:grid;gap:var(--s1)}
.lamp{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);min-height:26px;padding:2px var(--s3);border-radius:6px;background:var(--card-2)}
.lamp-s{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--muted);font:700 13px var(--sans)}
.lamp.ok .lamp-s{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.lamp.bad .lamp-s{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.vb{display:grid;grid-template-columns:minmax(0,1fr) auto 20px;align-items:center;gap:0 var(--s3)}
.vb .vb-n{grid-row:1;grid-column:1;font-size:14px;color:var(--muted)}
.vb .val{grid-row:1;grid-column:2;font:600 14px var(--mono);text-align:right}
.vb .vb-st{grid-row:1;grid-column:3;text-align:center;font-weight:700;color:var(--ok)}
.vb .bar{grid-row:2;grid-column:1 / -1;position:relative;height:6px;border-radius:999px;background:var(--bar);overflow:hidden}
.vb .bar b{position:absolute;inset:0 auto 0 0;width:0;background:var(--ok);transition:width .6s ease}
.vb.sin-barra .bar{display:none}
.vb.bad .val,.vb.bad .vb-st{color:var(--bad)}
.vb.bad .bar b{background:var(--bad)}
.vnote{min-height:0;margin:var(--s2) 0 0;font-size:12.5px;color:var(--muted)}
.cab-pistas{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.cab-pistas .label{margin:0}
.pistas-q{font-size:13px;color:var(--muted)}
.pista-txt{margin:var(--s1) 0 var(--s2);font-size:13.5px;color:var(--muted)}
.pista{width:100%}
.fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:center}
select{width:100%;min-width:0;min-height:44px;padding:var(--s2) var(--s3);font:500 15px var(--sans);color:var(--fg);background:var(--card-2);border:1px solid var(--line);border-radius:var(--r)}
select:disabled{opacity:.6}
select option:disabled{color:var(--muted)}
.caso-der .fila{grid-template-columns:minmax(0,1fr)}

.verif-box{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line)}
.verif-box .label{margin:0 0 var(--s2)}
.caso-der .foot{margin:0}
@media (min-width:1100px){.caso-wrap{grid-template-columns:minmax(0,1fr) 440px}.caso-der{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
@media (min-width:1400px){.caso-wrap{grid-template-columns:minmax(0,1fr) 540px}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;overflow:visible;padding:var(--s3) var(--s4);gap:var(--s3)}
  .nav,.side-pie{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));align-items:center}
  .side-pie{margin-top:0}
  .principal{padding:var(--s4) var(--s4) var(--s5)}
  .pasos{padding:var(--s3)}
  .paso-t{font-size:11px}
}
@media (max-width:480px){
  button.prueba{grid-template-columns:minmax(0,1fr) auto;gap:var(--s2)}
  button.prueba .ui-ico{display:none}
  button.prueba .ui-chev{display:none}
  .fila{grid-template-columns:minmax(0,1fr)}
  .ultima-fila{grid-template-columns:auto minmax(0,1fr)}
  .ultima-fila .pill{grid-column:2;justify-self:start}
  .porque{padding:var(--s2) var(--s4)}
}
/* Mapa y quiz: foto a la izquierda y controles a la derecha en escritorio */
.mapa-card{display:grid;grid-template-columns:minmax(0,1fr) 300px;column-gap:var(--s4);align-items:start;padding:var(--s4)}
.mapa-card .map{margin:0;max-width:640px}
.mapa-panel{display:grid;gap:var(--s3);align-content:start;min-width:0}
.mapa-panel .modes,.mapa-panel .legend{margin:0}
.mapa-panel .info{margin:0}
@media (max-width:900px){.mapa-card{display:block}.mapa-card .map{max-width:none;margin-bottom:var(--s3)}}
.mapa-raiz .credit{margin-top:var(--s2);padding-top:var(--s2)}
</style>
</head>
<body>
<main id="app"></main>
<script src="js/motor.js"></script>
<script src="temas/placa-base.js"></script>
<script>
  Temario.iniciar(document.getElementById('app'), window.TEMAS);
</script>
</body>
</html>
