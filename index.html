<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Clase de microinformática: elige la UF de hardware (montaje y reparación) o la de software (averías lógicas).">
  <title>Microinformática | Elige tu UF</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%276%27%20fill%3D%27%232E3440%27%2F%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%2388C0D0%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%3E%3Crect%20x%3D%277%27%20y%3D%277%27%20width%3D%2718%27%20height%3D%2718%27%20rx%3D%273%27%2F%3E%3Cpath%20d%3D%27M12%2012h8v8h-8zM12%202v3M20%202v3M12%2027v3M20%2027v3M2%2012h3M2%2020h3M27%2012h3M27%2020h3%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">

  <script>
    (() => {
      try {
        const saved = localStorage.getItem("temario-tema");
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.theme = saved;
          return;
        }
      } catch (_) {}

      document.documentElement.dataset.theme =
        matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
    })();
  </script>

  <script src="js/halloween.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #2E3440;
      --surface: #3B4252;
      --surface-hover: #434C5E;
      --text: #ECEFF4;
      --muted: #D8DEE9;
      --border: #596579;
      --accent: #88C0D0;
      --accent-2: #B48EAD;
      --focus: #88C0D0;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #ECEFF4;
      --surface: #E5E9F0;
      --surface-hover: #D8DEE9;
      --text: #2E3440;
      --muted: #434C5E;
      --border: #A0AAB9;
      --accent: #3B6EA0;
      --accent-2: #7B4F95;
      --focus: #5E81AC;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { min-width: 320px; background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .barra {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: min(1080px, 100% - 32px);
      margin: 0 auto;
      padding: 20px 0;
    }

    .marca {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
    }

    .marca svg { width: 28px; height: 28px; color: var(--accent); }

    .tema {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .tema:hover { background: var(--surface-hover); }
    .tema svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    .tema .sol { display: none; }
    html[data-theme="light"] .tema .sol { display: block; }
    html[data-theme="light"] .tema .luna { display: none; }
    html[data-halloween="on"] .tema { display: none; }

    .eleccion {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(880px, 100% - 32px);
      margin: 0 auto;
      padding: 32px 0 64px;
      text-align: center;
    }

    .eleccion h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.1;
      letter-spacing: -.02em;
    }

    .eleccion > p {
      margin: 0 0 40px;
      color: var(--muted);
      font-size: 18px;
    }

    .botones {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      width: 100%;
    }

    .boton-uf {
      --tono: var(--accent);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 40px 28px 34px;
      border: 2px solid color-mix(in srgb, var(--tono) 55%, var(--border));
      border-radius: 20px;
      background: color-mix(in srgb, var(--tono) 8%, var(--surface));
      color: var(--text);
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .boton-uf.software { --tono: var(--accent-2); }

    .boton-uf:hover {
      transform: translateY(-3px);
      border-color: var(--tono);
      box-shadow: 0 12px 30px color-mix(in srgb, var(--tono) 25%, transparent);
    }

    .boton-uf:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

    .boton-uf .icono {
      display: grid;
      place-items: center;
      width: 84px;
      height: 84px;
      margin-bottom: 6px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--tono) 18%, transparent);
      color: var(--tono);
    }

    .boton-uf .icono svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .boton-uf .nombre { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }

    .boton-uf .uf {
      font: 600 13px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
      letter-spacing: .08em;
      color: var(--tono);
    }

    .boton-uf .detalle { color: var(--muted); font-size: 16px; }

    .boton-uf .nueva {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--tono);
      color: var(--bg);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    @media (max-width: 640px) {
      .botones { grid-template-columns: 1fr; gap: 16px; }
      .boton-uf { padding: 30px 20px 26px; }
      .eleccion > p { margin-bottom: 28px; }
    }
  </style>
</head>

<body>
  <header class="barra">
    <a class="marca" href="index.html">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="7" y="7" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 12h8v8h-8zM12 2v3M20 2v3M12 27v3M20 27v3M2 12h3M2 20h3M27 12h3M27 20h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Microinformática</span>
    </a>
    <button class="tema" type="button" aria-label="Cambiar tema claro u oscuro">
      <svg class="luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="eleccion">
    <h1>¿Qué UF vas a estudiar?</h1>
    <p>Elige una para entrar en sus apuntes, prácticas y simulacros.</p>

    <div class="botones">
      <a class="boton-uf hardware" href="hardware.html">
        <span class="icono" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 9h6v6H9zM9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>
        </span>
        <span class="nombre">Hardware</span>
        <span class="uf">UF0861 · UF0863</span>
        <span class="detalle">Montaje y reparación de equipos</span>
      </a>

      <a class="boton-uf software" href="software.html">
        <span class="nueva">Nueva</span>
        <span class="icono" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M9.5 8.5 7 11l2.5 2.5M14.5 8.5 17 11l-2.5 2.5"/></svg>
        </span>
        <span class="nombre">Software</span>
        <span class="uf">UF0864</span>
        <span class="detalle">Resolución de averías lógicas</span>
      </a>
    </div>
  </main>

  <script>
    document.querySelector(".tema").addEventListener("click", () => {
      const nuevo = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      document.documentElement.dataset.theme = nuevo;
      try { localStorage.setItem("temario-tema", nuevo); } catch (_) {}
    });
  </script>
</body>
</html>
